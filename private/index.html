<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bảng điều khiển</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1d2127; --muted: #69707d; --border: #e2e5ea;
    --accent: #2563eb; --accent-text: #fff; --danger: #dc2626; --shadow: 0 1px 3px rgba(0,0,0,.06);
    --personal-bg: #e0f2fe; --personal-fg: #075985; --corp-bg: #ede9fe; --corp-fg: #5b21b6;
    --chip-bg: #eef0f3; --row-hover: #f8f9fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101317; --card: #1a1e24; --text: #e6e8eb; --muted: #9aa1ab; --border: #2b3139;
      --accent: #4f8cff; --accent-text: #fff; --danger: #f87171; --shadow: none;
      --personal-bg: #0c3a52; --personal-fg: #9fd8f7; --corp-bg: #2e2257; --corp-fg: #cdbdfb;
      --chip-bg: #262c34; --row-hover: #1f242b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px 16px 64px; }
  [hidden] { display: none !important; }
  a { color: var(--accent); }
  h1 { font-size: 1.35rem; margin: 0; }
  h2 { font-size: 1.05rem; margin: 0; }
  h3 { font-size: 1rem; margin: 0; word-break: break-word; }
  .muted { color: var(--muted); }
  .err { color: var(--danger); margin: 8px 0; }
  .warn { background: var(--card); border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; }
  .center { text-align: center; padding: 64px 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .card-head > a { font-size: .875rem; }
  .head-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .stack > * { margin-bottom: 12px; }
  .stack > :last-child { margin-bottom: 0; }

  button, .btn { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 8px 14px; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { color: var(--danger); }
  button.small, .btn.small { padding: 3px 10px; font-size: .85rem; }
  button:disabled { opacity: .6; cursor: default; }
  input:not([type=checkbox]), textarea, select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; width: 100%; }
  input:focus, textarea:focus, select:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=checkbox] { width: 18px; height: 18px; margin: 3px 0 0; flex-shrink: 0; accent-color: var(--accent); }

  .google-btn { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; }
  .google-btn svg { width: 18px; height: 18px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .user { display: flex; align-items: center; gap: 8px; font-size: .9rem; min-width: 0; }
  .user img { width: 28px; height: 28px; border-radius: 50%; }
  .user span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border); margin-bottom: 12px; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs a { padding: 8px 12px; text-decoration: none; color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  #tabs a:hover { color: var(--text); }
  #tabs a[aria-current] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .controls input { flex: 1; min-width: 160px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; border-radius: 0; padding: 7px 12px; background: transparent; font-size: .9rem; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-text); }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .tile { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; text-decoration: none; color: var(--text); box-shadow: var(--shadow); }
  .tile:hover { border-color: var(--muted); }
  .tile-value { font-size: 1.8rem; font-weight: 700; line-height: 1.1; }
  .tile-label { color: var(--muted); font-size: .85rem; }
  .tile.danger .tile-value { color: var(--danger); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .grid > .stack { min-width: 0; }

  .list { display: grid; }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 4px; border-top: 1px solid var(--border); }
  .list > .row:first-child { border-top: 0; }
  .row:hover { background: var(--row-hover); }
  .row-main { flex: 1; min-width: 0; }
  .row-title { word-break: break-word; }
  .row.done .row-title { text-decoration: line-through; color: var(--muted); }
  .row-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .8rem; margin-top: 2px; }
  .card > .row-meta { margin-top: 8px; }
  .badge, .chip { border-radius: 999px; padding: 0 8px; font-size: .75rem; line-height: 1.5; white-space: nowrap; }
  .badge.personal { background: var(--personal-bg); color: var(--personal-fg); }
  .badge.corp { background: var(--corp-bg); color: var(--corp-fg); }
  .chip { background: var(--chip-bg); color: var(--muted); }
  .due { color: var(--muted); }
  .due.over { color: var(--danger); font-weight: 600; }
  .group-title { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .empty { text-align: center; padding: 16px 0; margin: 0; }
  #quick-add { margin-bottom: 8px; }
  .card > button.small { margin-top: 8px; }

  .note-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .note-body { white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; }
  .feed-body { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .feed-body.expanded { display: block; }

  .agenda section + section { margin-top: 10px; }
  .day-head { font-size: .85rem; color: var(--muted); text-transform: capitalize; margin-bottom: 2px; }
  .evt { display: flex; gap: 12px; padding: 6px 0; }
  .evt-time { width: 62px; flex-shrink: 0; color: var(--muted); font-size: .85rem; padding-top: 2px; }
  .evt-main { min-width: 0; }
  .evt-title { word-break: break-word; }
  .evt-meta { font-size: .8rem; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; }

  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); padding: 0; width: min(640px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { display: grid; gap: 12px; padding: 16px; }
  .field { display: grid; gap: 4px; }
  .field-label { font-size: .85rem; color: var(--muted); }
  dialog textarea { min-height: 35vh; resize: vertical; }
  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .dialog-actions .spacer { flex: 1; }

  code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: .9em; }

  @media (max-width: 760px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <section id="state-loading" class="center muted">Đang tải…</section>

  <section id="state-config" class="card" hidden>
    <h1>Chưa cấu hình Firebase</h1>
    <p>Dán cấu hình Firebase vào <code>private/firebase-config.js</code> (xem <code>_firebase/README.md</code>).</p>
  </section>

  <section id="state-login" class="center" hidden>
    <h1>Bảng điều khiển</h1>
    <p class="muted">Đăng nhập để xem thông tin.</p>
    <button id="login-btn" class="google-btn" type="button">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Đăng nhập bằng Google
    </button>
    <p id="login-err" class="err" role="alert"></p>
  </section>

  <section id="state-denied" class="center" hidden>
    <h1>Không có quyền truy cập</h1>
    <p class="muted">Tài khoản <strong id="denied-email"></strong> không được phép xem trang này.</p>
    <button id="denied-logout" type="button">Đăng xuất</button>
  </section>

  <section id="state-app" hidden>
    <header class="topbar">
      <h1>Bảng điều khiển</h1>
      <div class="user">
        <img id="user-photo" alt="" referrerpolicy="no-referrer" hidden>
        <span id="user-email"></span>
        <button id="logout-btn" class="small" type="button">Đăng xuất</button>
      </div>
    </header>
    <nav id="tabs" aria-label="Chuyên mục">
      <a href="#/" data-tab="overview">Tổng quan</a>
      <a href="#/tasks" data-tab="tasks">Công việc</a>
      <a href="#/calendar" data-tab="calendar">Lịch</a>
      <a href="#/notes" data-tab="notes">Ghi chú</a>
      <a href="#/links" data-tab="links">Liên kết</a>
      <a href="#/feed" data-tab="feed">Cập nhật</a>
    </nav>
    <div class="controls">
      <div id="area-seg" class="seg" role="group" aria-label="Lọc theo lĩnh vực">
        <button type="button" data-area="all">Tất cả</button>
        <button type="button" data-area="personal">Cá nhân</button>
        <button type="button" data-area="corp">Tập đoàn</button>
      </div>
      <input id="search" type="search" placeholder="Tìm kiếm…" aria-label="Tìm kiếm">
    </div>
    <p id="app-warn" class="warn" role="alert" hidden></p>
    <p id="app-err" class="err" role="alert"></p>
    <div id="view"></div>
  </section>
</main>

<dialog id="form-dialog">
  <form id="form" method="dialog">
    <h2 id="form-title"></h2>
    <div id="form-fields" style="display:grid;gap:12px"></div>
    <p id="form-err" class="err" role="alert" hidden></p>
    <div class="dialog-actions">
      <button id="form-delete" class="danger" type="button">Xoá</button>
      <span class="spacer"></span>
      <button id="form-cancel" type="button">Huỷ</button>
      <button id="form-save" class="primary" type="submit">Lưu</button>
    </div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
